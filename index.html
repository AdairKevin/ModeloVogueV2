<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NYAH · XV Edition — Invitación</title>
    <meta name="description" content="Estás invitado a la edición más especial: los XV de NYAH.">
    <meta name="theme-color" content="#f8b6c9">
    <meta property="og:title" content="NYAH · XV Edition">
    <meta property="og:description" content="Estás invitado a la edición más especial: los XV de NYAH.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/img/fotos/foto1.jpg">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&amp;family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@400;500&amp;family=Playball&amp;display=swap" rel="stylesheet">

    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/envelope.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body class="">
    <!-- Todos los textos, fotos y links se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
    <!-- =========================
            SOBRE VIRTUAL
    ========================== -->
    <div class="envelope-screen" id="envelopeScreen">
      <div class="fx" id="sobreFx" aria-hidden="true"></div>

      <p class="envelope-kicker">{{sobre.frase}}</p>

      <div class="envelope" id="envelope">
        <div class="envelope-flap"></div>

        <!-- Carta que asoma al abrir -->
        <div class="envelope-letter" aria-hidden="true">{{sobre.carta}}</div>

        <div class="wax-seal" id="openEnvelope" role="button" tabindex="0" aria-label="{{sobre.selloAria}}"></div>
      </div>

      <p class="envelope-hint">{{sobre.instruccion}}</p>
    </div>

    <div class="progreso" id="progreso" aria-hidden="true"></div>

    <div class="invitation-content hidden" id="invitationContent">
      <div class="container">
        <!-- =========================
            MÚSICA
    ========================== -->
        <audio id="backgroundMusic" loop="" preload="none">
          <source src="{{musica.archivo}}" type="audio/mpeg">
          {{musica.sinSoporte}}
        </audio>

        <!-- =========================
            PORTADA
    ========================== -->
        <section id="hero">
          <div class="hero"></div>
          <div class="fx hero-fx" id="heroFx" aria-hidden="true"></div>

          <div class="hero-content">
            <div class="hero-text">
              <h1 class="hero-title">{{portada.titulo}}</h1>
            </div>
          </div>

          <div class="hero-scroll" aria-hidden="true">{{portada.desliza}}</div>
        </section>

        <section id="name">
          <div class="name">
            <h2 class="name-xv">{{nombre.nombre}}</h2>
            <p class="edition-xv">{{nombre.edicion}}</p>
            <span class="edition-year">{{nombre.anio}}</span>
          </div>
        </section>

        <!-- =========================
        WELCOME
    ========================== -->
        <section id="welcome">
          <span class="editorial-label">{{bienvenida.etiqueta}}</span>

          <p class="editorial-message">{{bienvenida.texto}}</p>
        </section>

        <!-- =========================
        FOTOS PRINCIPALES
    ========================== -->
        <section id="fotos-principales">
          <div class="container-fotos">
            {{#fotosPrincipales.fotos}}
            <img src="{{foto}}" alt="{{alt}}">
            {{/fotosPrincipales.fotos}}
            
          </div>
        </section>

        <!-- =========================
        CUENTA REGRESIVA
    ========================== -->
        <section id="countdown">
          <div class="fecha">
            <h1 id="fechaDia">SABADO</h1>
            <h2 id="fechaTexto">JUNIO 25, 2027</h2>
          </div>
          <div class="timer">
            <h1 class="timer-titulo">{{cuentaRegresiva.titulo}}</h1>
            <ul class="date-time">
              <li>
                <div class="time_number" id="dias"></div>
                <div class="time_txt">{{cuentaRegresiva.dias}}</div>
              </li>
              <li>
                <div class="time_number" id="horas"></div>
                <div class="time_txt">{{cuentaRegresiva.horas}}</div>
              </li>
              <li>
                <div class="time_number" id="minutos"></div>
                <div class="time_txt">{{cuentaRegresiva.minutos}}</div>
              </li>
              <li>
                <div class="time_number" id="segundos"></div>
                <div class="time_txt">{{cuentaRegresiva.segundos}}</div>
              </li>
            </ul>
          </div>
        </section>

        <section id="calendar" class="section">
          <div class="editorial-header">
            <span class="editorial-tag">{{calendario.etiqueta}}</span>

            <h2 class="editorial-title" id="calendarioTitulo">JUNIO 2027</h2>
          </div>

          <div class="calendar" id="calendario">
            <!-- Días -->
            <div class="day-name">LUN</div>
            <div class="day-name">MAR</div>
            <div class="day-name">MIE</div>
            <div class="day-name">JUE</div>
            <div class="day-name">VIE</div>
            <div class="day-name">SAB</div>
            <div class="day-name">DOM</div>

            <!-- Semana 1 -->
            <div class="empty"></div>
            <div class="empty"></div>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>

            <!-- Semana 2 -->
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>

            <!-- Semana 3 -->
            <div>13</div>
            <div>14</div>
            <div>15</div>
            <div>16</div>
            <div>17</div>
            <div>18</div>
            <div>19</div>

            <!-- Semana 4 -->
            <div>20</div>
            <div>21</div>
            <div>22</div>
            <div>23</div>
            <div>24</div>
            <div class="event-day">25</div>
            <div>26</div>

            <!-- Semana 5 -->
            <div>27</div>
            <div>28</div>
            <div>29</div>
            <div>30</div>
            <div class="empty"></div>
            <div class="empty"></div>
            <div class="empty"></div>
          </div>

          <a class="btn-calendar" id="btnCalendario" href="#" target="_blank" rel="noopener noreferrer">{{calendario.boton}}</a>
        </section>

        <!-- =========================
        HISTORIA / MENSAJE
    ========================== -->
        <section id="editorial-story">
          <div class="editorial-heading">
            <span class="editorial-category">{{historia.categoria}}</span>
            <h2 class="editorial-title">{{historia.titulo}}</h2>
            <p class="editorial-subtitle">{{historia.subtitulo}}</p>
          </div>

          <figure class="editorial-photo">
            <img src="{{historia.foto}}" alt="{{historia.fotoAlt}}">

            <figcaption>{{historia.pieDeFoto}}</figcaption>
          </figure>

          <article class="editorial-article">
            <p>{{historia.parrafo1}}</p>

            <p>{{historia.parrafo2}}</p>

            <p>{{historia.parrafo3}}</p>
          </article>
        </section>

        <!-- =========================
        PADRES Y PADRINOS
    ========================== -->

        <section class="collage">
          {{#collage.fotos}}
          <div class="card card{{@indice}}">
            <img src="{{foto}}">
          </div>
          {{/collage.fotos}}

          

          

          
        </section>

        <section class="section-familia">
          <div class="familia-container">
            <span class="familia-subtitulo">{{familia.subtitulo}}</span>

            <h2 class="familia-titulo">{{familia.titulo}}</h2>

            <p class="familia-texto">{{familia.texto}}</p>

            <div class="linea"></div>

            <div class="familia-grid">
              {{#familia.grupos}}
              <div class="familia-item">
                <h3>{{titulo}}</h3>

                <p>{{nombre1}}</p>
                <p>{{nombre2}}</p>
              </div>
              {{/familia.grupos}}

              
            </div>
          </div>
        </section>

        <!-- =========================
        CRONOGRAMA
    ========================== -->
        <section class="schedule">
          <div class="schedule-header">
            <span class="schedule-tag">{{cronograma.etiqueta}}</span>

            <h2 class="schedule-title">{{cronograma.titulo}}</h2>

            <p class="schedule-description">{{cronograma.descripcion}}</p>
          </div>

          <div class="schedule-list">
            {{#cronograma.actividades}}
            <article class="schedule-item">
              <div class="schedule-time">{{hora}}</div>

              <div class="schedule-content">
                <span class="number">{{numero}}</span>

                <h3>{{actividad}}</h3>

                {{#lugar}}<p>{{lugar}}</p>{{/lugar}}
              </div>
            </article>
            {{/cronograma.actividades}}

            

            

            

            
          </div>
        </section>

        <!-- =========================
        CEREMONIA y RECEPCIÓN
    ========================== -->
        <section class="Ubicaciones">
          <img src="{{ubicaciones.imagen}}" class="ubicacionHero" alt="">
        </section>

        <section class="boarding-section">
          <div class="section-title">
            <span>{{ubicaciones.etiqueta}}</span>

            <h2>{{ubicaciones.titulo}}</h2>
          </div>

          {{#ubicaciones.pases}}
          <article class="boarding-pass {{@lado}}">
            <div class="ticket-cut left-cut"></div>
            <div class="ticket-cut right-cut"></div>

            <small>{{etiqueta}}</small>

            <h3>{{titulo}}</h3>

            <h4>{{lugar}}</h4>

            <div class="ticket-divider"></div>

            <div class="ticket-info">
              <div>{{dato1}}</div>

              <div>{{dato2}}</div>

              <div>{{dato3}}</div>
            </div>

            <a href="{{mapa}}" data-mapa="">{{boton}}</a>
          </article>
          {{/ubicaciones.pases}}

          
        </section>
        <!-- =========================
        DRESS CODE
    ========================== -->
        <section id="dresscode" class="dresscode-section">
          <div class="dresscode-heading">
            <span class="editorial-tag">{{vestimenta.etiqueta}}</span>
            <h2>{{vestimenta.titulo}}</h2>
            <p>{{vestimenta.subtitulo}}</p>
          </div>

          <div class="dresscode-card">
            <span class="dresscode-number">{{vestimenta.numero}}</span>
            <p class="dresscode-label">{{vestimenta.etiquetaTarjeta}}</p>
            <h3>{{vestimenta.codigo}}</h3>
            <div class="dresscode-line"></div>
            <p class="dresscode-copy">{{vestimenta.texto}}</p>
          </div>
        </section>
        <!-- =========================
        MESA DE REGALOS
    ========================== -->
        <section id="gifts" class="gifts-section">
          <div class="gifts-heading">
            <span class="editorial-tag">{{regalos.etiqueta}}</span>
            <h2>{{regalos.titulo}}</h2>
            <p>{{regalos.subtitulo}}</p>
          </div>

          <div class="gifts-card">
            <span class="gifts-edition">{{regalos.edicion}}</span>
            <h3>{{regalos.tituloTarjeta}}</h3>
            <p>{{regalos.texto}}</p>
            <a class="gifts-link" href="{{regalos.link}}" target="_blank" rel="noopener noreferrer">{{regalos.boton}}</a>
          </div>
        </section>

        <!-- =========================
        CONFIRMACIÓN
    ========================== -->
        <section id="rsvp" class="rsvp-section">
          <div class="rsvp-card">
            <span class="editorial-tag">{{confirmacion.etiqueta}}</span>
            <h2>{{confirmacion.titulo}}</h2>
            <p>{{confirmacion.texto}}</p>
            <a class="rsvp-link" id="rsvpLink" href="{{confirmacion.link}}" target="_blank" rel="noopener noreferrer">{{confirmacion.boton}}</a>
          </div>
        </section>

        <!-- =========================
        SECCIÓN EXTRA
    ========================== -->
        <section id="extras" class="social-section">
          <span class="editorial-tag">{{instagram.etiqueta}}</span>
          <h2>{{instagram.titulo}}</h2>
          <p>{{instagram.texto}}</p>
          <a class="social-hashtag" href="{{instagram.link}}" target="_blank" rel="noopener noreferrer">{{instagram.hashtag}}</a>
          <p class="social-note">{{instagram.nota}}</p>
        </section>

        <!-- =========================
            FOOTER
    ========================== -->
        <footer class="mirai-footer">
          <span>{{footer.etiqueta}}</span>
          <p>{{footer.texto}}</p>
          <a href="{{footer.link}}" aria-label="{{footer.marcaAria}}">{{footer.marca}}</a>
          <small>{{footer.subtitulo}}</small>
        </footer>
      </div>

      <button class="music-btn" id="musicBtn" type="button" aria-label="{{musica.botonAria}}" aria-pressed="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- JavaScript -->

      <script src="js/script.js"></script>
    </template>

    <script src="js/motor.js"></script>
  </body>
</html>
